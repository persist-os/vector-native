description: >
  Instructions for artifact generator agents to read Vector Native formatted tool
  results from A2A notes. Extracts raw data from Payload Layer and processes it
  according to user instructions. Ensures artifact generators handle all processing
  while tool executors only fetch raw data.

usage:
  input_format: plain_text
  output_format: structured_artifact
  system_prompt_path: ./artifact_generator_vector_native_reader.md
  agent_type: widget_artifact_executor

